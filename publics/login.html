<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria — Login Page</title>

  <!-- FAVICON (Path internal folder library) -->
  <link rel="icon" type="image/png" href="./library/aetheria.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Fira+Code:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- EXTERNAL CSS & THEME -->
  <link rel="stylesheet" href="./style/login.css">
  <link rel="stylesheet" href="./style/theme.css">
  <script src="./javascript/theme.js"></script>
</head>

<body class="min-h-screen bg-[#020305] text-slate-200 antialiased flex flex-col justify-between selection:bg-rose-600 selection:text-white relative">

  <!-- TOAST CONTAINER -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none"></div>

  <div class="relative z-10 flex flex-col min-h-screen justify-between">

    <!-- NAVBAR -->
    <header class="border-b border-rose-950/80 bg-[#020305]/95 sticky top-0 z-40 backdrop-blur-md">
      <div class="max-w-6xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex flex-row justify-between items-center gap-2 w-full">
        <a href="./index.html" class="flex items-center gap-2.5 sm:gap-3 shrink">
          <img src="./library/aetheria.png" alt="Aetheria Logo" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full object-cover brand-logo-img shrink-0">
          <div class="min-w-0">
            <span class="font-black text-sm sm:text-base text-white tracking-widest block leading-tight font-epic truncate">AETHERIA<span class="text-rose-500">: ECLIPSE</span></span>
            <p class="text-[9px] text-slate-400 font-mono-code tracking-tight hidden sm:block" data-i18n="nav.network">AUTH PORTAL GATEWAY</p>
          </div>
        </a>

        <div class="flex items-center gap-1.5 sm:gap-2 font-mono-code shrink-0">
          <!-- THEME TOGGLE BUTTON -->
          <button type="button" id="themeToggleBtn" onclick="toggleTheme()" class="theme-toggle-btn h-9 px-2.5 sm:px-3 flex items-center justify-center" title="Toggle Theme">
            <i class="fa-solid fa-sun text-amber-400 text-base leading-none"></i>
            <span class="hidden sm:inline ml-1.5 text-xs">Light</span>
          </button>

          <!-- LANGUAGE TOGGLE BUTTON -->
          <button type="button" id="langToggleBtn" onclick="toggleLanguage()" class="lang-toggle-btn h-9 px-2.5 sm:px-3 flex items-center justify-center" title="Toggle Language">
            <span class="lang-toggle-badge bg-emerald-600 text-white text-xs font-bold px-1.5 py-0.5 rounded">ID</span>
            <span class="hidden sm:inline ml-1.5 text-xs text-slate-300">ID</span>
          </button>

          <a href="./index.html" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-bold text-xs h-9 px-2.5 sm:px-3.5 rounded-xl transition flex items-center justify-center gap-1.5 font-mono-code" title="Beranda">
            <i class="fa-solid fa-house text-base leading-none"></i> <span data-i18n="nav.home" class="hidden sm:inline">Home</span>
          </a>
        </div>
      </div>
    </header>

    <!-- MAIN LOGIN CONTAINER -->
    <main class="w-full max-w-md mx-auto px-3 sm:px-4 py-8 sm:py-12 flex-1 flex flex-col justify-center items-center relative">

      <!-- ATMOSPHERIC BACKGROUND GLOW -->
      <div class="absolute w-72 h-72 bg-rose-600/15 rounded-full blur-[100px] pointer-events-none -z-10"></div>

      <section class="supreme-card w-full p-5 sm:p-8 rounded-2xl border border-rose-500/40 glow-rose relative overflow-hidden shadow-2xl backdrop-blur-xl">
        <div class="space-y-6">

          <!-- CARD HEADER -->
          <div class="text-center space-y-3">
            <div class="w-14 h-14 sm:w-16 sm:h-16 bg-rose-500/10 border border-rose-500/40 rounded-2xl flex items-center justify-center mx-auto text-rose-400 text-2xl sm:text-3xl shadow-lg shadow-rose-950/50">
              <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1 class="text-xl sm:text-2xl font-black text-white font-epic tracking-wide" data-i18n="login.title">LOGIN AETHERIA</h1>
            <p class="text-xs text-slate-400 font-mono-code leading-relaxed max-w-xs mx-auto" data-i18n="login.desc">Gunakan Username & Password yang sama dengan di dalam Server Minecraft (/login)</p>
          </div>

          <!-- LOGIN FORM -->
          <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-4 font-mono-code text-xs">
            <div>
              <label class="block text-slate-300 font-semibold mb-1.5 flex items-center gap-1.5">
                <i class="fa-solid fa-user text-rose-400"></i> <span data-i18n="checkout.user_label">Username Minecraft</span>
              </label>
              <input type="text" id="loginUsername" required placeholder="Contoh: Steve" data-i18n-placeholder="checkout.user_ph" class="w-full input-box px-3.5 py-3 rounded-xl text-white bg-slate-950/80 border border-slate-800 focus:border-rose-500 focus:outline-none transition shadow-inner">
            </div>

            <div>
              <label class="block text-slate-300 font-semibold mb-1.5 flex items-center gap-1.5">
                <i class="fa-solid fa-key text-rose-400"></i> <span data-i18n="login.pass_label">Password In-Game (/login)</span>
              </label>
              <div class="relative">
                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full input-box px-3.5 py-3 pr-10 rounded-xl text-white bg-slate-950/80 border border-slate-800 focus:border-rose-500 focus:outline-none transition shadow-inner">
                <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 p-1 focus:outline-none transition" title="Tampilkan/Sembunyikan Password">
                  <i id="togglePasswordIcon" class="fa-solid fa-eye text-sm"></i>
                </button>
              </div>
            </div>

            <!-- ERROR ALERT MESSAGE -->
            <div id="loginError" class="hidden p-3 bg-rose-950/60 border border-rose-500/60 text-rose-300 rounded-xl text-xs font-semibold leading-relaxed flex items-center gap-2">
              <i class="fa-solid fa-triangle-exclamation text-rose-400 shrink-0"></i>
              <span id="loginErrorText">Username atau password in-game salah!</span>
            </div>

            <button type="submit" id="btnLogin" class="h-11 sm:h-12 w-full bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl transition uppercase tracking-wider font-epic shadow-lg shadow-rose-950/60 flex items-center justify-center gap-2 text-xs sm:text-sm active:scale-[0.98]">
              <i class="fa-solid fa-right-to-bracket text-base leading-none"></i> <span data-i18n="login.submit">Masuk Sekarang</span>
            </button>
          </form>

        </div>
      </section>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800/60 py-4 text-center text-xs text-slate-500 font-mono-code">
      &copy; 2026 Aetheria: Dragon's Eclipse. &bull; Not affiliated with Mojang AB. &bull; Powered by RaditNex Infrastructure
    </footer>

  </div>

  <script src="./javascript/i18n.js" defer></script>
  <script src="./javascript/cookies.js" defer></script>
  <script src="./javascript/login.js" defer></script>
</body>

</html>
